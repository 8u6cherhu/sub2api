name: Weekly upstream build and release

on:
  push:
    branches:
      - hermes-build
    paths:
      - .github/workflows/weekly-sync-release.yml
      - patches/hermes-web-search-function.patch
      - patches/request-dump.patch
      - patches/antigravity-macos-identity.patch
      - patches/antigravity-native-gemini-normalization.patch
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Optional upstream branch, tag, or commit
        required: false
        default: main
  schedule:
    - cron: "17 4 * * 1,4"

permissions:
  contents: write
  packages: write

concurrency:
  group: weekly-upstream-build-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api

jobs:
  build-release:
    if: github.repository == '8u6cherhu/sub2api'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v6

      - name: Check out upstream Sub2API
        env:
          REQUESTED_REF: ${{ inputs.upstream_ref || 'main' }}
        run: |
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${UPSTREAM_REPOSITORY}.git" upstream
          git -C upstream checkout "${REQUESTED_REF}"

      - name: Apply Hermes compatibility patch
        run: |
          patch_file="${GITHUB_WORKSPACE}/patches/hermes-web-search-function.patch"

          if git -C upstream apply --check "${patch_file}"; then
            git -C upstream apply "${patch_file}"
          elif git -C upstream apply --reverse --check "${patch_file}"; then
            echo "Upstream already contains the Hermes web_search behavior; patch skipped."
          else
            echo "The compatibility patch no longer applies cleanly to upstream." >&2
            exit 1
          fi

      - name: Apply continuous request dump patch
        run: |
          patch_file="${GITHUB_WORKSPACE}/patches/request-dump.patch"
          if git -C upstream apply --check "${patch_file}"; then
            git -C upstream apply "${patch_file}"
          elif grep -q 'SUB2API_REQUEST_DUMP_ENABLED' upstream/backend/internal/pkg/requestdump/requestdump.go \
            && grep -q 'requestdump.Capture' upstream/backend/internal/pkg/antigravity/client.go; then
            echo "Upstream already contains continuous request dump; patch skipped."
          else
            echo "The request capture patch no longer applies cleanly to upstream." >&2
            exit 1
          fi

      - name: Apply Antigravity macOS identity patch
        run: |
          patch_file="${GITHUB_WORKSPACE}/patches/antigravity-macos-identity.patch"
          if git -C upstream apply --check "${patch_file}"; then
            git -C upstream apply "${patch_file}"
          elif grep -q 'User requests are enclosed within <USER_REQUEST> tags' upstream/backend/internal/pkg/antigravity/request_transformer.go \
            && grep -q 'The USER.*OS version is mac\.' upstream/backend/internal/pkg/antigravity/request_transformer.go \
            && ! grep -q 'SYSTEM_PROMPT_END' upstream/backend/internal/pkg/antigravity/request_transformer.go; then
            echo "Antigravity macOS identity patch already present; patch skipped."
          else
            echo "The Antigravity identity patch no longer applies cleanly to upstream." >&2
            exit 1
          fi

      - name: Apply native Gemini request normalization patch
        run: |
          patch_file="${GITHUB_WORKSPACE}/patches/antigravity-native-gemini-normalization.patch"
          if git -C upstream apply --check "${patch_file}"; then
            git -C upstream apply "${patch_file}"
          elif git -C upstream apply --reverse --check "${patch_file}"; then
            echo "Upstream already contains native Gemini request normalization; patch skipped."
          else
            echo "The native Gemini request normalization patch no longer applies cleanly to upstream." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: upstream/backend/go.mod
          cache-dependency-path: upstream/backend/go.sum

      - name: Test patched backend
        working-directory: upstream/backend
        run: go test ./internal/pkg/antigravity ./internal/service

      - name: Prepare release metadata
        id: release
        run: |
          upstream_sha="$(git -C upstream rev-parse HEAD)"
          upstream_short="$(git -C upstream rev-parse --short=12 HEAD)"
          upstream_version="$(tr -d '\r\n' < upstream/backend/cmd/server/VERSION)"
          go_version="$(awk '$1 == "go" { print $2; exit }' upstream/backend/go.mod)"
          if [[ ! "${go_version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Unable to determine a valid Go version from upstream/backend/go.mod" >&2
            exit 1
          fi
          patch_short="$(sha256sum patches/*.patch | sha256sum | cut -c1-12)"
          release_tag="weekly-$(date -u +%Y%m%d)-${upstream_short}-p${patch_short}"
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "upstream_sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"
          echo "upstream_short=${upstream_short}" >> "${GITHUB_OUTPUT}"
          echo "go_version=${go_version}" >> "${GITHUB_OUTPUT}"
          echo "patch_short=${patch_short}" >> "${GITHUB_OUTPUT}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "image_name=${image_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${upstream_version}-weekly.${upstream_short}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.image_name }}:weekly-latest
            ${{ steps.release.outputs.image_name }}:${{ steps.release.outputs.tag }}
          build-args: |
            GOLANG_IMAGE=golang:${{ steps.release.outputs.go_version }}-alpine
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ steps.release.outputs.upstream_sha }}+hermes.${{ steps.release.outputs.patch_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IMAGE_NAME: ${{ steps.release.outputs.image_name }}
          UPSTREAM_SHA: ${{ steps.release.outputs.upstream_sha }}
          PATCH_SHORT: ${{ steps.release.outputs.patch_short }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists: ${RELEASE_TAG}"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Sub2API ${RELEASE_TAG}" \
          --notes "Independent upstream build with four upstream-tracking compatibility patches.

          Upstream: ${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA}
          Patch: ${PATCH_SHORT}
          Image: ${IMAGE_NAME}:weekly-latest

          The canonical main branch stays aligned with upstream; this build runs only from hermes-build after targeted backend tests pass."

      - name: Retain the five newest releases and images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.release.outputs.image_name }}
        run: |
          mapfile -t old_releases < <(
            gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName,createdAt \
              --jq 'map(select(.tagName | startswith("weekly-"))) | sort_by(.createdAt) | reverse | .[5:] | .[].tagName'
          )
          for tag in "${old_releases[@]}"; do
            [ -n "${tag}" ] || continue
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          done

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mapfile -t old_versions < <(
            gh api --paginate --slurp \
              "/users/${owner}/packages/container/sub2api/versions?per_page=100" \
              | jq -r 'add | sort_by(.created_at) | reverse | .[5:] | .[].id'
          )
          for version_id in "${old_versions[@]}"; do
            [ -n "${version_id}" ] || continue
            gh api --method DELETE \
              "/users/${owner}/packages/container/sub2api/versions/${version_id}"
          done
