name: Weekly upstream build and release

# Goal: always build the latest Wei-Shaw/sub2api main, then apply the four
# maintained Hermes patches exactly. If any patch no longer applies cleanly,
# fail the workflow so the patch can be reviewed and rebased; never silently
# accept partial or approximate upstream behavior.
# The fork branches are synchronized with upstream main. Hermes changes live
# in patches/, not in the checked-in upstream source; builds apply them once
# to a fresh upstream checkout.

on:
  push:
    branches:
      - hermes-build
    paths:
      - .github/workflows/weekly-sync-release.yml
      - patches/hermes-web-search-function.patch
      - patches/request-dump.patch
      - patches/antigravity-macos-identity.patch
      - patches/antigravity-native-gemini-normalization.patch
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1,4"

permissions:
  contents: write
  packages: write

concurrency:
  group: weekly-upstream-build-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Wei-Shaw/sub2api

jobs:
  build-release:
    if: github.repository == '8u6cherhu/sub2api'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v6

      - name: Check out upstream Sub2API
        run: |
          git init upstream
          git -C upstream remote add origin "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git -C upstream fetch --depth=1 origin refs/heads/main
          git -C upstream checkout --detach FETCH_HEAD

      - name: Apply Hermes compatibility patch
        run: |
          patch_file="${GITHUB_WORKSPACE}/patches/hermes-web-search-function.patch"
          if ! git -C upstream apply --check "${patch_file}"; then
            echo "The Hermes compatibility patch must be rebased against the latest upstream main." >&2
            exit 1
          fi
          git -C upstream apply "${patch_file}"

      - name: Apply continuous request dump patch
        run: |
          patch_file="${GITHUB_WORKSPACE}/patches/request-dump.patch"
          if ! git -C upstream apply --check "${patch_file}"; then
            echo "The request dump patch must be rebased against the latest upstream main." >&2
            exit 1
          fi
          git -C upstream apply "${patch_file}"

      - name: Apply Antigravity macOS identity patch
        run: |
          patch_file="${GITHUB_WORKSPACE}/patches/antigravity-macos-identity.patch"
          if ! git -C upstream apply --check "${patch_file}"; then
            echo "The Antigravity macOS identity patch must be rebased against the latest upstream main." >&2
            exit 1
          fi
          git -C upstream apply "${patch_file}"

      - name: Apply native Gemini request normalization patch
        run: |
          patch_file="${GITHUB_WORKSPACE}/patches/antigravity-native-gemini-normalization.patch"
          if ! git -C upstream apply --check "${patch_file}"; then
            echo "The native Gemini normalization patch must be rebased against the latest upstream main." >&2
            exit 1
          fi
          git -C upstream apply "${patch_file}"

      - name: Prepare release metadata
        id: release
        run: |
          upstream_sha="$(git -C upstream rev-parse HEAD)"
          upstream_short="$(git -C upstream rev-parse --short=12 HEAD)"
          upstream_version="$(tr -d '\r\n' < upstream/backend/cmd/server/VERSION)"
          go_version="$(awk '$1 == "go" { print $2; exit }' upstream/backend/go.mod)"
          if [[ ! "${go_version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Unable to determine a valid Go version from upstream/backend/go.mod" >&2
            exit 1
          fi
          patch_short="$(sha256sum patches/*.patch | sha256sum | cut -c1-12)"
          release_tag="weekly-$(date -u +%Y%m%d)-${upstream_short}-p${patch_short}"
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "upstream_sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"
          echo "upstream_short=${upstream_short}" >> "${GITHUB_OUTPUT}"
          echo "go_version=${go_version}" >> "${GITHUB_OUTPUT}"
          echo "patch_short=${patch_short}" >> "${GITHUB_OUTPUT}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "image_name=${image_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${upstream_version}-weekly.${upstream_short}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.image_name }}:weekly-latest
            ${{ steps.release.outputs.image_name }}:${{ steps.release.outputs.tag }}
          build-args: |
            GOLANG_IMAGE=golang:${{ steps.release.outputs.go_version }}-alpine
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ steps.release.outputs.upstream_sha }}+hermes.${{ steps.release.outputs.patch_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IMAGE_NAME: ${{ steps.release.outputs.image_name }}
          UPSTREAM_SHA: ${{ steps.release.outputs.upstream_sha }}
          PATCH_SHORT: ${{ steps.release.outputs.patch_short }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists: ${RELEASE_TAG}"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Sub2API ${RELEASE_TAG}" \
          --notes "Independent upstream build with four upstream-tracking compatibility patches.

          Upstream: ${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA}
          Patch: ${PATCH_SHORT}
          Image: ${IMAGE_NAME}:weekly-latest

          Every build starts from the latest Wei-Shaw/sub2api main, then applies the four maintained patches.
          The fork branches track upstream main. Hermes changes are maintained as patches and applied once to a fresh upstream checkout.
          The upstream SHA above identifies the source used for this image."

      - name: Retain the five newest releases and images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.release.outputs.image_name }}
        run: |
          mapfile -t old_releases < <(
            gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName,publishedAt \
              --jq 'map(select(.tagName | startswith("weekly-"))) | sort_by(.publishedAt) | reverse | .[5:] | .[].tagName'
          )
          for tag in "${old_releases[@]}"; do
            [ -n "${tag}" ] || continue
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          done

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mapfile -t old_versions < <(
            gh api --paginate --slurp \
              "/users/${owner}/packages/container/sub2api/versions?per_page=100" \
              | jq -r 'add | sort_by(.created_at) | reverse | .[5:] | .[].id'
          )
          for version_id in "${old_versions[@]}"; do
            [ -n "${version_id}" ] || continue
            gh api --method DELETE \
              "/users/${owner}/packages/container/sub2api/versions/${version_id}"
          done
